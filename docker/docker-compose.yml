# ============================================================
# SmartTravel（智游）Docker Compose 生产部署配置
# ============================================================
# 使用方式:
#   1. cp .env.example .env          # 复制环境变量模板
#   2. 编辑 .env 填入真实密钥
#   3. docker compose up -d          # 启动所有服务
#   4. docker compose logs -f        # 查看日志
#   5. docker compose down -v        # 停止并清理数据卷
# ============================================================

services:
  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.4
    container_name: smarttravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smarttravel}
      MYSQL_USER: ${MYSQL_USER:-smarttravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smarttravel123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - smarttravel-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: smarttravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smarttravel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: smarttravel-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms256m -Xmx512m}
      - xpack.security.enabled=false
      - network.host=0.0.0.0
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - smarttravel-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smarttravel-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smarttravel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-smarttravel123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - smarttravel-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== 微服务 ====================

  gateway:
    build:
      context: ../backend
      dockerfile: gateway/Dockerfile
    container_name: smarttravel-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smarttravel-prod-secret-key}
    networks:
      - smarttravel-net
    depends_on:
      user-service:
        condition: service_started
      itinerary-service:
        condition: service_started
      search-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    container_name: smarttravel-user-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Docker 网络覆盖（容器名代替宿主机 IP）
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-smarttravel}:${MYSQL_PASSWORD:-smarttravel123}@mysql:3306/${MYSQL_DATABASE:-smarttravel}
      - REDIS_URL=redis://redis:6379/0
      # 密钥（从 .env 注入）
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smarttravel-prod-secret-key}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-云涟科技验证平台}
      - SMS_TEMPLATE_CODE=${SMS_TEMPLATE_CODE:-100001}
    networks:
      - smarttravel-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  itinerary-service:
    build:
      context: ../backend
      dockerfile: itinerary-service/Dockerfile
    container_name: smarttravel-itinerary-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      # Docker 网络覆盖
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-smarttravel}:${MYSQL_PASSWORD:-smarttravel123}@mysql:3306/${MYSQL_DATABASE:-smarttravel}
      - REDIS_URL=redis://redis:6379/0
      # 密钥
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smarttravel-prod-secret-key}
      - DIFY_BASE_URL=${DIFY_BASE_URL:-http://host.docker.internal}
      - DIFY_INTENT_PARSER_KEY=${DIFY_INTENT_PARSER_KEY}
      - DIFY_ITINERARY_GENERATOR_KEY=${DIFY_ITINERARY_GENERATOR_KEY}
      - DIFY_REPLAN_AGENT_KEY=${DIFY_REPLAN_AGENT_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smarttravel-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  search-service:
    build:
      context: ../backend
      dockerfile: search-service/Dockerfile
    container_name: smarttravel-search-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    networks:
      - smarttravel-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  payment-service:
    build:
      context: ../backend
      dockerfile: payment-service/Dockerfile
    container_name: smarttravel-payment-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      # Docker 网络覆盖
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-smarttravel}:${MYSQL_PASSWORD:-smarttravel123}@mysql:3306/${MYSQL_DATABASE:-smarttravel}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-smarttravel}:${RABBITMQ_DEFAULT_PASS:-smarttravel123}@rabbitmq:5672/
      - USER_SERVICE_URL=http://user-service:8001
      # 密钥
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smarttravel-prod-secret-key}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL}
      - ALIPAY_RETURN_URL=${ALIPAY_RETURN_URL}
    volumes:
      # 支付宝沙箱密钥文件（只读挂载）
      - ../backend/payment-service/alipay_private_key.pem:/app/payment-service/alipay_private_key.pem:ro
      - ../backend/payment-service/alipay_public_key.pem:/app/payment-service/alipay_public_key.pem:ro
    networks:
      - smarttravel-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    container_name: smarttravel-notification-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      # Docker 网络覆盖
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-smarttravel}:${MYSQL_PASSWORD:-smarttravel123}@mysql:3306/${MYSQL_DATABASE:-smarttravel}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-smarttravel}:${RABBITMQ_DEFAULT_PASS:-smarttravel123}@rabbitmq:5672/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smarttravel-prod-secret-key}
    networks:
      - smarttravel-net
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==================== 前端 ====================

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smarttravel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - smarttravel-net
    depends_on:
      - gateway

  # ==================== 反向代理（统一入口）====================

  nginx:
    image: nginx:alpine
    container_name: smarttravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smarttravel-net
    depends_on:
      - gateway
      - frontend

# ==================== 网络 ====================

networks:
  smarttravel-net:
    driver: bridge
    name: smarttravel-net

# ==================== 数据卷 ====================

volumes:
  mysql_data:
    name: smarttravel-mysql-data
  redis_data:
    name: smarttravel-redis-data
  es_data:
    name: smarttravel-es-data
  rabbitmq_data:
    name: smarttravel-rabbitmq-data
